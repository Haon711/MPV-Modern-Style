<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>

    <!--
        MPV fonts.conf - versione pulita Windows

        CUSTOMFONTDIR = cartella fonts di mpv
        WINDOWSFONTDIR = cartella font di Windows

        Importante:
        lasciare WINDOWSFONTDIR attivo permette a fontconfig
        di trovare font come Segoe UI, Arial, Consolas, Meiryo,
        Yu Gothic, Malgun Gothic, Microsoft YaHei, ecc.
    -->

    <!-- Font locali di mpv: %APPDATA%\mpv\fonts oppure portable_config\fonts -->
    <dir>CUSTOMFONTDIR</dir>

    <!-- Font di sistema Windows: C:\Windows\Fonts -->
    <dir>WINDOWSFONTDIR</dir>

    <!-- Cache fontconfig locale -->
    <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>


    <!-- ===================================================== -->
    <!-- ALIAS BASE                                            -->
    <!-- ===================================================== -->

    <!-- Accetta "mono" come "monospace" -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>mono</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>monospace</string>
        </edit>
    </match>

    <!-- Accetta "sans serif" come "sans-serif" -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans serif</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>sans-serif</string>
        </edit>
    </match>

    <!-- Accetta "sans" come "sans-serif" -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>sans-serif</string>
        </edit>
    </match>


    <!-- ===================================================== -->
    <!-- FONT PREFERITI                                       -->
    <!-- ===================================================== -->

    <!-- Sans-serif: ottimo per sottotitoli, OSD e testi moderni -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Segoe UI</family>
            <family>Segoe UI Semibold</family>
            <family>Arial</family>
            <family>Verdana</family>

            <!-- Giapponese -->
            <family>Yu Gothic</family>
            <family>Yu Gothic UI</family>
            <family>Meiryo</family>
            <family>MS Gothic</family>

            <!-- Coreano -->
            <family>Malgun Gothic</family>

            <!-- Cinese -->
            <family>Microsoft YaHei</family>
            <family>Microsoft JhengHei</family>
            <family>SimSun</family>

            <!-- Fallback se installati -->
            <family>Noto Sans</family>
            <family>Noto Sans CJK JP</family>
            <family>Noto Sans CJK KR</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Sans CJK TC</family>
            <family>DejaVu Sans</family>
            <family>Liberation Sans</family>
        </prefer>
    </alias>

    <!-- Serif: fallback per sottotitoli o ASS che richiedono font serif -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Times New Roman</family>
            <family>Yu Mincho</family>
            <family>MS Mincho</family>
            <family>SimSun</family>
            <family>Batang</family>

            <!-- Fallback se installati -->
            <family>Noto Serif</family>
            <family>Noto Serif CJK JP</family>
            <family>Noto Serif CJK KR</family>
            <family>Noto Serif CJK SC</family>
            <family>Noto Serif CJK TC</family>
            <family>DejaVu Serif</family>
            <family>Liberation Serif</family>
        </prefer>
    </alias>

    <!-- Monospace: utile per OSD, stats, debug e sottotitoli tecnici -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Consolas</family>
            <family>Cascadia Mono</family>
            <family>Courier New</family>
            <family>MS Gothic</family>
            <family>Malgun Gothic</family>

            <!-- Fallback se installati -->
            <family>Noto Sans Mono</family>
            <family>DejaVu Sans Mono</family>
            <family>Liberation Mono</family>
        </prefer>
    </alias>


    <!-- ===================================================== -->
    <!-- FALLBACK GENERICO                                    -->
    <!-- ===================================================== -->

    <!-- Se un font non appartiene a serif/sans/mono, aggiunge sans-serif -->
    <match target="pattern">
        <test qual="all" name="family" compare="not_eq">
            <string>sans-serif</string>
        </test>
        <test qual="all" name="family" compare="not_eq">
            <string>serif</string>
        </test>
        <test qual="all" name="family" compare="not_eq">
            <string>monospace</string>
        </test>
        <edit name="family" mode="append_last">
            <string>sans-serif</string>
        </edit>
    </match>


    <!-- ===================================================== -->
    <!-- FONT ICONICO DI MPV-OSC-MODERN                        -->
    <!-- ===================================================== -->

    <!--
        mpv-osc-modern usa:
        material-design-iconic-font

        Il file deve stare in:
        %APPDATA%\mpv\fonts\Material-Design-Iconic-Font.ttf
    -->
    <alias binding="same">
        <family>material-design-iconic-font</family>
        <accept>
            <family>Material Design Iconic Font</family>
            <family>Material-Design-Iconic-Font</family>
            <family>material-design-iconic-font</family>
        </accept>
    </alias>


    <!-- ===================================================== -->
    <!-- REFRESH CACHE                                        -->
    <!-- ===================================================== -->

    <config>
        <rescan>
            <int>30</int>
        </rescan>
    </config>

</fontconfig>