# ============================================================
# MPV INPUT.CONF - SETUP KEVIN
# mpv-osc-modern with.thumbfast + thumbfast + autosubsync
# ============================================================


# ============================================================
# MENU INTERNI MPV
# ============================================================

Alt+p script-binding select/select-playlist
Alt+a script-binding select/select-aid
Alt+s script-binding select/select-sid
Alt+d script-binding select/select-audio-device
Alt+c script-binding select/select-chapter
Alt+b script-binding select/select-binding
Alt+r script-binding select/show-properties


# ============================================================
# AUTOSUBSYNC
# ============================================================

# Autosubsync registra già N da solo.
# Non usare N per altri comandi.
# Se vuoi forzarlo manualmente, puoi togliere il commento:
# n script-binding autosubsync-menu


# ============================================================
# PROFILI VIDEO/AUDIO DAL TUO MPV.CONF
# ============================================================

# Hardware decoding sicuro per video pesanti / drop frame
Alt+h apply-profile hwdec-safe

# Profilo più leggero per GPU integrata o file pesanti
Alt+g apply-profile low-gpu

# Frame pacing più fluido, meno purista per audio
Alt+v apply-profile smooth-video

# Interpolazione: più fluido, meno cinematografico
Alt+i apply-profile interpolation

# Deband leggero
Alt+e apply-profile deband

# Deband forte
Alt+Shift+e apply-profile strong-deband

# Deinterlace manuale
Alt+x apply-profile deinterlace

# Deinterlace automatico, solo se serve
Alt+Shift+x apply-profile deinterlace-auto

# PCM multicanale via HDMI verso AVR/soundbar
Alt+m apply-profile hdmi-surround

# Passthrough Dolby/DTS via HDMI verso AVR/soundbar compatibile
Alt+Shift+m apply-profile bitstream

# Disattiva ICC se i colori sembrano strani
Alt+Shift+i apply-profile no-icc

# Temporal dithering opzionale
Alt+t apply-profile temporal-dither

# Reset rapido alla base purista del tuo config
Alt+Shift+r set deband no ; set interpolation no ; set video-sync audio ; set deinterlace no ; set hwdec no ; set temporal-dither no ; set icc-profile-auto yes ; show-text "Profilo base ripristinato"


# ============================================================
# COMANDI VIDEO UTILI
# ============================================================

# Mostra/nasconde statistiche
i script-binding stats/display-stats-toggle

# Screenshot normale
s screenshot

# Screenshot con sottotitoli
S screenshot subtitles

# Screenshot dell'intera finestra
Ctrl+s screenshot window

# Frame avanti / indietro
. frame-step
, frame-back-step

# Cicla aspect ratio
a cycle-values video-aspect-override "no" "16:9" "4:3" "2.35:1" "1.85:1"

# Reset zoom/pan/aspect
Alt+0 set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0 ; set video-aspect-override no


# ============================================================
# SOTTOTITOLI
# ============================================================

# Attiva/disattiva sottotitoli
v cycle sub-visibility

# Traccia sottotitoli successiva/precedente
j cycle sub
J cycle sub down

# Ritardo sottotitoli
z add sub-delay -0.1
x add sub-delay +0.1
Z add sub-delay -1
X add sub-delay +1

# Sposta sottotitoli su/giù
Ctrl+UP add sub-pos -1
Ctrl+DOWN add sub-pos +1

# Scala sottotitoli
Ctrl++ add sub-scale +0.05
Ctrl+- add sub-scale -0.05
Ctrl+0 set sub-scale 1


# ============================================================
# AUDIO
# ============================================================

# Traccia audio successiva/precedente
k cycle audio
K cycle audio down

# Ritardo audio
Ctrl+LEFT add audio-delay -0.1
Ctrl+RIGHT add audio-delay +0.1

# Mute
m cycle mute

# Volume
UP add volume 5
DOWN add volume -5


# ============================================================
# PLAYBACK / SEEK
# ============================================================

SPACE cycle pause

# Seek brevi
LEFT seek -5 exact
RIGHT seek 5 exact

# Seek medi
Shift+LEFT seek -30 exact
Shift+RIGHT seek 30 exact

# Seek lunghi
Ctrl+LEFT seek -60 exact
Ctrl+RIGHT seek 60 exact

# Vai a inizio/fine
HOME seek 0 absolute-percent
END seek 100 absolute-percent

# Velocità playback
[ multiply speed 0.9091
] multiply speed 1.1
BACKSPACE set speed 1.0


# ============================================================
# PLAYLIST
# ============================================================

# File precedente/successivo nella playlist
PGUP playlist-prev
PGDWN playlist-next

# Shuffle playlist
Alt+Shift+s cycle shuffle

# Loop file
l cycle-values loop-file "inf" "no"

# Loop playlist
L cycle-values loop-playlist "inf" "no"


# ============================================================
# FINESTRA
# ============================================================

# Fullscreen
f cycle fullscreen

# Sempre in primo piano
T cycle ontop

# Chiudi salvando posizione
q quit-watch-later

# Chiudi senza salvare posizione
Q quit