# ============================================================
# MPV CONFIG - VIDEOFILO / AUDIOFILO - SDR ONLY
# Windows - mpv-osc-modern with.thumbfast
# Senza HDR / senza tone mapping / senza filtri invasivi
# ============================================================


# ============================================================
# GENERALE
# ============================================================

profile=high-quality

vo=gpu-next
gpu-api=d3d11
gpu-context=auto

priority=high
fullscreen=yes
force-seekable=yes
keep-open=always
save-position-on-quit=yes
watch-later-dir="~~/cache/watch_later"

# Playlist automatica dei file simili nella stessa cartella
autocreate-playlist=same

# Cache shader
gpu-shader-cache-dir="~~/cache/shaders"


# ============================================================
# DECODIFICA VIDEO
# ============================================================

# Default purista: decodifica software.
# Se hai drop frame con video pesanti, usa il profilo [hwdec-safe].
hwdec=no


# ============================================================
# COLORE / LIVELLI - SDR ONLY
# ============================================================

# Non forzare full range.
# Non usare vf=format=colorlevels=full.
# Lascia mpv rispettare metadata, livelli e spazio colore del file.
target-prim=auto
target-trc=auto
video-output-levels=auto

# Profilo ICC del monitor impostato in Windows.
# Se i colori sembrano strani, usa il profilo [no-icc].
icc-profile-auto=yes

# Dithering sicuro.
dither-depth=auto
dither=fruit

# Spento di default per evitare possibile flicker.
# Puoi attivarlo con [temporal-dither].
temporal-dither=no


# ============================================================
# SCALING VIDEO
# ============================================================

correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
scaler-resizes-only=yes

# Upscale nitido ma naturale
scale=ewa_lanczossharp

# Downscale equilibrato
dscale=mitchell

# Chroma scaling buono senza shader esterni
cscale=ewa_lanczossharp

# Anti-ringing moderato
scale-antiring=0.6
dscale-antiring=0.6
cscale-antiring=0.6


# ============================================================
# DEBAND
# ============================================================

# Spento di default: preserva dettaglio fine e grana originale.
# Attivalo solo quando vedi banding reale.
deband=no

deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=8


# ============================================================
# SINCRONIA VIDEO / AUDIO
# ============================================================

# Scelta audiofila: l'audio resta il riferimento.
# Per frame pacing più fluido usa [smooth-video].
video-sync=audio

# Niente interpolazione: mantiene il look originale 24p/25p/30p.
interpolation=no

# Spento di default: attivalo solo su contenuti davvero interlacciati.
deinterlace=no


# ============================================================
# AUDIO - AUDIOFILO
# ============================================================

ao=wasapi
audio-exclusive=yes
wasapi-exclusive-buffer=default

# Non forzare samplerate/formato.
# Niente audio-samplerate=96000.
# Niente audio-format=s32.
volume=100
volume-max=100

audio-device=auto
audio-file-auto=fuzzy
audio-pitch-correction=yes

# Sicuro per cuffie, DAC USB, casse stereo e uso normale.
audio-channels=auto-safe

# Non attivare di default.
# audio-stream-silence=yes

# Niente normalizzazione/compressione dinamica.
# audio-normalize-downmix=yes
# af=loudnorm
# af=dynaudnorm


# ============================================================
# PASSTHROUGH AUDIO OPZIONALE
# ============================================================

# Lascia commentato per cuffie, DAC USB o casse stereo.
# Usa il profilo [bitstream] solo via HDMI verso AVR/soundbar compatibile.
#
# audio-spdif=ac3,eac3,dts,dts-hd,truehd


# ============================================================
# LINGUE AUDIO / SOTTOTITOLI
# ============================================================

alang=ja,jp,jpn,it,ita,en,eng
slang=it,ita,en,eng

sub-auto=fuzzy
sub-file-paths=sub;subs;subtitles
demuxer-mkv-subtitle-preroll=yes
embeddedfonts=yes

# Preserva gli stili ASS originali, importante per anime/fansub.
sub-ass-override=no
sub-fix-timing=no

# Non fonde i sottotitoli nel video.
blend-subtitles=no

# Solo per SRT o sottotitoli senza stile proprio.
sub-font="Segoe UI Semibold"
sub-font-size=46
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2.4
sub-shadow-color="#80000000"
sub-shadow-offset=0.7
sub-margin-y=50


# ============================================================
# OSD / INTERFACCIA
# ============================================================

# Obbligatorio per mpv-osc-modern / modern.lua custom.
# Disattiva l'OSC integrato di mpv.
osc=no

osd-bar=no
border=no
cursor-autohide-fs-only=yes
cursor-autohide=500

osd-level=1
osd-duration=1200
osd-font="Segoe UI"
osd-font-size=22
osd-color="#FFFFFFFF"
osd-border-color="#FF000000"
osd-border-size=0.8


# ============================================================
# SCREENSHOT
# ============================================================

screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=1
screenshot-directory="~/Pictures/mpv-screenshots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"


# ============================================================
# CACHE
# ============================================================

cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
demuxer-readahead-secs=60
cache-pause=no


# ============================================================
# PROFILO IDLE PER MPV-OSC-MODERN
# ============================================================

[Idle]
profile-cond=p["idle-active"]
profile-restore=copy-equal
title=' '
keepaspect=no
background=color
background-color="#000000"


# ============================================================
# PROFILI MANUALI
# ============================================================

[hwdec-safe]
profile-desc=Hardware decoding sicuro per video pesanti o drop frame
hwdec=auto-safe

[smooth-video]
profile-desc=Frame pacing più fluido, meno purista per audio
video-sync=display-resample
video-sync-max-video-change=1
interpolation=no

[interpolation]
profile-desc=Interpolazione: movimento più fluido, meno cinematografico
video-sync=display-resample
video-sync-max-video-change=1
interpolation=yes
tscale=oversample
tscale-antiring=0.6

[deband]
profile-desc=Deband leggero per video con banding visibile
deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16
deband-grain=8

[strong-deband]
profile-desc=Deband forte per streaming/WEB-DL brutti
deband=yes
deband-iterations=4
deband-threshold=64
deband-range=20
deband-grain=12

[deinterlace]
profile-desc=Deinterlace manuale per contenuti realmente interlacciati
deinterlace=yes

[deinterlace-auto]
profile-desc=Deinterlace automatico, da usare solo se serve
deinterlace=auto

[hdmi-surround]
profile-desc=PCM multicanale via HDMI verso AVR/soundbar
audio-channels=7.1,5.1,stereo

[bitstream]
profile-desc=Passthrough Dolby/DTS via HDMI verso AVR/soundbar compatibile
audio-spdif=ac3,eac3,dts,dts-hd,truehd

[vulkan]
profile-desc=Prova Vulkan se D3D11 dà problemi o vuoi testare prestazioni
gpu-api=vulkan
gpu-context=auto

[low-gpu]
profile-desc=Più leggero per GPU integrata o video molto pesanti
hwdec=auto-safe
scale=ewa_lanczos
dscale=mitchell
cscale=mitchell
scale-antiring=0.6
dscale-antiring=0.6
cscale-antiring=0.6

[no-icc]
profile-desc=Disattiva ICC se i colori sembrano strani
icc-profile-auto=no

[temporal-dither]
profile-desc=Temporal dithering opzionale
temporal-dither=yes