# ============================================================
# autosubsync-mpv - config corretta Windows
# Percorso:
# %APPDATA%\mpv\script-opts\autosubsync.conf
# ============================================================

# Lascia vuoto se ffmpeg.exe è nel PATH.
# Esempio manuale valido:
# ffmpeg_path=C:/Program Files/ffmpeg/bin/ffmpeg.exe
ffmpeg_path=

# Lascia vuoto se ffsubsync.exe è nel PATH.
# Dopo: py -m pip install -U ffsubsync
# deve funzionare: ffsubsync --version
# Esempio manuale valido:
# ffsubsync_path=C:/Users/Kevin/AppData/Roaming/Python/Python312/Scripts/ffsubsync.exe
ffsubsync_path=

# Alass è opzionale. Lascia vuoto se non lo installi.
alass_path=

# Strumento preferito per sincronizzare il sottotitolo sull'audio del video.
audio_subsync_tool=ffsubsync

# Strumento preferito per sincronizzare un sottotitolo usando un altro sottotitolo come riferimento.
altsub_subsync_tool=ffsubsync

# Più sicuro: lascia caricato anche il sottotitolo vecchio,
# così puoi confrontare vecchio/nuovo.
unload_old_sub=no

# Mai sovrascrivere il sottotitolo originale.
overwrite_old_sub=no

# Consigliato lasciare vuoto:
# il file _retimed viene salvato nella cartella del sottotitolo originale.
#
# Nota importante:
# non usare ~~ qui, perché ffsubsync/alass sono programmi esterni
# e potrebbero non espandere correttamente il percorso mpv.
#
# Se vuoi una cartella separata, usa un percorso ASSOLUTO con slash normali:
# new_sub_directory=C:/Users/Kevin/AppData/Roaming/mpv/retimed-subtitles
new_sub_directory=
