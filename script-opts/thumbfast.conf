# ============================================================
# thumbfast - config consigliata SDR only / mpv-osc-modern
# Percorso:
# %APPDATA%\mpv\script-opts\thumbfast.conf
# ============================================================

socket=
thumbnail=

# 16:9 pulito, più utile di 200x200 per film/anime/serie.
max_width=320
max_height=180

scale_factor=1

# Tu vuoi setup senza HDR/tone mapping.
tone_mapping=no

overlay_id=42

# Spento per non avviare il processo thumbnailer appena apri il file.
spawn_first=no

# Chiude il processo thumbnailer dopo 20 secondi di inattività.
quit_after_inactivity=20

# Spento: evita thumbnail su streaming/web.
network=no

# Spento: non serve per audio.
audio=no

# Coerente col profilo purista.
hwdec=no

# Windows: lascia no, più stabile.
direct_io=no

# Se mpv.exe è nel PATH, lascia così.
# Se usi mpv.net/front-end e non funziona, metti il percorso completo di mpv.exe.
mpv_path=mpv
